; =============================================================================
;  MMA hotkeys - THE single source of truth. Every hotkey in MMA lives here.
;
;  Edit this file directly, or use the Hotkeys GUI (mass_gui -> "Hotkeys...").
;  Changes apply live - no restart.
;
;  Modifiers:   ^ = Ctrl    ! = Alt    + = Shift    # = Win
;  Examples:    F4   !F4 (Alt+F4)   ^+z (Ctrl+Shift+Z)   XButton2   ^MButton
;  Blank value = that feature is disabled.
;  F13-F24     = Corsair Scimitar side buttons 1-12.
;
;  NOTE: comments must sit on their own line. Windows' ini reader does NOT
;  strip a trailing "; comment" from a value - it would become part of the key.
; =============================================================================


; --- Navigation --------------------------------------------------------------
[nav]
unread          = !-
focusAuto       = !Space
nextChat        = Down
unreadLeft      = +Left
focusTop        = Up
clickUnread     = Del
clickHome       = End
clickPpv        = PgDn


; --- Mass: model 1 -----------------------------------------------------------
; These keys mean MODEL 1 and nothing else. No gating, no detector: the key you
; press IS the model selector, so F1 sends model 1's follow-up whatever is on
; screen. That is what makes them the reliable answer when the detector is not.
;
; The shared keys that DO follow the front tab are in [mass.active] at the bottom
; of this file. The comment that used to be here said fu1-fu3 were shared and
; auto-gated, which stopped being true when the three model scripts became one.
[mass.1]
fu1             = F1
fu2             = F2
fu3             = F3
altFu1         = ^F1
altFu2         = ^F2
altFu3         = ^F3
fu1short        = Ins
fu2short        = Home
fu3short        = PgUp
ppv             = F4
ppvFus          = F5
b1Ppv           = !F4
brPick          = F6
brFu2           = F7
brFu3           = F8
brPpv           = !F8


; --- Mass: model 2 -----------------------------------------------------------
[mass.2]
fu1             = F9
fu2             = F10
fu3             = F11
altFu1         = ^F9
altFu2         = ^F10
altFu3         = ^F11
ppv             = F12
ppvFus          = !F12
brPick          =
brFu2           =
brFu3           =
brPpv           =


; --- Mass: model 3 -----------------------------------------------------------
[mass.3]
fu1             = F6
fu2             = F7
fu3             = !F7
altFu1         = ^F6
altFu2         = ^F7
altFu3         = ^!F7
ppv             = F8
ppvFus          = !F8
brPick          =
brFu2           =
brFu3           =
brPpv           =


; --- Chat --------------------------------------------------------------------
; Chrome only.
[chat]
captureEnter    = Enter


; --- Sequences ---------------------------------------------------------------
; copyDiscordMsg fires in Discord only.
[seq]
openFarmolijer  = ^!f
copyDiscordMsg  = ^LButton
selectTopPpv    =


; --- Utilities ---------------------------------------------------------------
[util]
afkClick        = ^p
recoverMsg      = ^+z
clickSecondGrey = F24
debugGrey       = F23


; --- GUI ---------------------------------------------------------------------
; toggleDoubleMM fires only while Mouse control is on in Settings.
; ocrGrab: drag a box on screen, OCR it, and open Add Hotkey prefilled.
[gui]
addHotkeyGrab   = !0
ocrGrab         = !+0
toggleDoubleMM  = MButton
toggleStats     =
actions         = ^!m
quickActions    = ^!q


; --- Recorder ----------------------------------------------------------------
[recorder]
toggle          = ^!F12


; --- Automation --------------------------------------------------------------
; Bound by Python, NOT AHK. Declared in hotkeys.ahk so this GUI can edit them, but
; nothing AHK-side binds them: they only fire while the listener is running.
; Start it silently (no console, like the AHK scripts) by double-clicking
;     automation\automation_listen.vbs
; Stop / check:  python automation\automation.py --stop  (or --status)
; It logs to error_log.txt, re-reads this file live, and gates itself to the
; Infloww Messages window. Blank = disabled, same as everywhere else.
; unsendLast: unsends your bottom-most message. If your last run (everything sent
; since the fan's last reply) has more than one, a prompt appears - press the key
; again to unsend the whole run, tap Esc for just the last, HOLD Esc to cancel.
[automation]
hopKebabs       = ^!k
unsendLast      = ^!u
countSales      = ^!s


; --- General -----------------------------------------------------------------
[general]
openFast        = !+=
openAndRate     = !+]
antiCc          = ^!a


; The [aliw] and [temp] sections lived here. Every one of those keys fired a
; function that only sent a canned message, so they are hotstrings now — see the
; note at the top of acc\ALIW.ahk. temp.fantasy was never bound to anything.


; --- Capitalizer -------------------------------------------------------------
; enterCap binds bare Enter, so nothing else may claim it.
[cap]
enterCap        = Enter
enterPass1      = +Enter
enterPass2      = ^Enter


; --- Mass: the ACTIVE model ---------------------------------------------------
;  ONE key set that follows whichever model is in front, so you never have to
;  remember that F9 is model 2. Which model that is comes from Settings ->
;  "Decide which model by": the screen detector (name / tab position), or your
;  own [mass.select] keys below.
;
;  This covers everything the numbered sections do, not just fu1-3 — a shared set
;  that could only send follow-ups would still leave you hunting for the right
;  numbered key for the PPV.
;
;  mFu1-3 / mPpv / mPpvFus are the MOUSE overload: a SECOND key for the same
;  action, exactly like fu1short. They moved here out of [mass.1], where being
;  declared under model 1 meant XButton1 sent model 1's follow-up no matter which
;  model was on screen.
;
;  F13-F24 are the Corsair Scimitar's twelve side buttons. F23/F24 belong to
;  [util], which leaves F16-F22 for the rest of this set.
[mass.active]
fu1             = F13
fu2             = F14
fu3             = F15
mFu1            = XButton2
mFu2            = XButton1
mFu3            = ^MButton
altFu1          = ^F13
altFu2          = ^F14
altFu3          = ^F15
ppv             = F16
ppvFus          = F17
mPpv            =
mPpvFus         =
mass            = F18
nextFu          = ^XButton2
brPick          = F19
brFu2           = F20
brFu3           = F21
brPpv           = F22


; --- Mass: pick the active model ----------------------------------------------
;  Only needed when the screen detector cannot read your tab strip. Pressing one
;  of these says "I am on model N", switches Settings to manual, and shows a
;  tooltip to confirm; the [mass.active] keys above then follow that model until
;  you press another one.
;
;  It follows a TAB SWITCH ONLY IF YOU PRESS IT. That is the whole trade against
;  the detector, and the tooltip is there because the failure mode is silent.
[mass.select]
next            = ^!w
m1              = ^!1
m2              = ^!2
m3              = ^!3
