; =============================================================================
;  MMA hotkeys - THE single source of truth. Every hotkey in MMA lives here.
;
;  Edit this file directly, or use the Hotkeys GUI (mass_gui -> "Hotkeys...").
;  Changes apply live - no restart.
;
;  Modifiers:   ^ = Ctrl    ! = Alt    + = Shift    # = Win
;  Examples:    F4   !F4 (Alt+F4)   ^+z (Ctrl+Shift+Z)   XButton2   ^MButton
;  Blank value = that feature is disabled.
;  F13-F24     = Corsair Scimitar side buttons 1-12.
;
;  MMA's OWN modifier is Ctrl+Win (^#), not Ctrl+Alt. Every tool key is ^#key;
;  when Windows already uses Ctrl+Win+that key (D, V, C, S, Q, F, O, N, 1-0, L,
;  Enter, Space…) it is Ctrl+Shift+Win (^+#key) instead. Ctrl+Shift+O (ocrGrab)
;  is the one exception and stays as it is. (Ctrl+Fn is impossible: Windows
;  never sees the Fn key.) Write the modifiers in the order ^ ! + # — that is
;  how the key capture records them, and the clash check compares strings.
;
;  Every key editor in MMA refuses a combo Windows or another running program
;  already uses (HKP_SystemOwner in ui\hotkeys_core.ahk). Hand edits here skip
;  that check. Settings > Help lists every bound key and what it does.
;
;  NOTE: comments must sit on their own line. Windows' ini reader does NOT
;  strip a trailing "; comment" from a value - it would become part of the key.
; =============================================================================


; --- Navigation --------------------------------------------------------------
[nav]
unread          = !- | +Left
focusAuto       = !Space
nextChat        = Down
focusTop        = Up
clickUnread     = Del
clickHome       = End
clickPpv        = PgDn


; --- Mass: model 1 -----------------------------------------------------------
; These keys mean MODEL 1 and nothing else. No gating, no detector: the key you
; press IS the model selector, so F1 sends model 1's follow-up whatever is on
; screen. That is what makes them the reliable answer when the detector is not.
;
; The shared keys that DO follow the front tab are in [mass.active] at the bottom
; of this file. The comment that used to be here said fu1-fu3 were shared and
; auto-gated, which stopped being true when the three model scripts became one.
[mass.1]
fu1             = F1 | ^F1 | Ins
fu2             = F2 | ^F2 | Home
fu3             = F3 | ^F3 | PgUp
ppv             = F4
ppvFus          = F5 | !F4


; --- Mass: model 2 -----------------------------------------------------------
[mass.2]
fu1             = F9 | ^F9
fu2             = F10 | ^F10
fu3             = F11 | ^F11
ppv             = F12
ppvFus          = !F12


; --- Mass: model 3 -----------------------------------------------------------
[mass.3]
fu1             = F6 | ^F6
fu2             = F7 | ^F7
fu3             = !F7 | ^#F7
ppv             = F8
ppvFus          = !F8


; --- Chat --------------------------------------------------------------------
; Chrome only.
[chat]
captureEnter    = Enter


; --- Sequences ---------------------------------------------------------------
; copyDiscordMsg and mmGather fire in Discord only.
[seq]
openFarmolijer  = ^+#f
copyDiscordMsg  = ^LButton
selectTopPpv    =
mmGather        = ^#k


; --- Utilities ---------------------------------------------------------------
[util]
afkClick        = ^p
recoverMsg      = ^+z
clickSecondGrey = F24
; Fix grammar via the local model: cuts the selection (or the whole box) and fixes it.
; Then: leaves it on the clipboard for Ctrl+V, or with Settings > Features >
; "Fix grammar: fast mode" on, pastes it back for you.
;   casual: typos only, lowercase, no apostrophes.   alice: proper British English.
fixGrammarCasual = ^#r
fixGrammarAlice  = ^#e
; Suggest the next sexting message from the chat on screen; the one you pick goes
; on the clipboard. Fast when the Chat reader is on (Settings > Features).
suggest          = ^+#d
; PPV script picker: reusable PPV captions ranked by how often they sold (from the
; shift recorder), for the fan on screen. The one you pick goes on the clipboard.
ppvPick          = ^#p
; Freestyle reword: rewords the box (or the clipboard if the box is empty) - a PPV
; caption or mass follow-up - using the fan's words from the chat. Result on clipboard.
reword           = ^#t
; Debug: what's on screen, as the model sees it - the chat reader's read drawn as
; an Infloww-style chat beside the real pane (services/llm/chatview.pyw).
chatView         = ^+#w
; Live Trainer: a separate window mirroring the chat you are in. After each fan
; message the AI drafts a reply (never sent) and you grade it 1-10; your real reply
; is saved next to it. Needs the Chat reader on (Settings > Features).
liveTrainer      = ^#y
; TestFlow: the AI training lab (a local Infloww clone). Shift Viewer: the chats
; the shift recorder saved. Both also in the Tools window > AI suite.
testFlow         = ^#j
shiftViewer      = ^+#v
; Arena: the AI fan against her AI (TestFlow's arena.pyw); step in, edit, rewind.
arena            =


; --- GUI ---------------------------------------------------------------------
; ocrGrab: drag a box on screen, OCR it, and open Add Hotkey prefilled.
[gui]
clipboard       = ^#v
addHotkeyGrab   = !0
ocrGrab         = ^+o
toggleStats     =
; Shows/hides the reply-timer frames. The service keeps running either way, so
; bringing them back is instant. Blank by default like the stats toggle above —
; pick one under Settings > Hotkeys.
toggleReplyBox  =
actions         = ^#m
quickActions    = ^+#q
; help: Settings > Help, the searchable list of what every key does.
help            = ^#i
; activity: opens the typing-stats chart. Only live while the Activity tracker is
; on (Settings > Features, or the Tools window) — it is off by default.
activity        = ^#g
; timer: the countdown window. timerToggle starts/stops it with no window, using
; what the window last saved. Live while Timer is on (Settings > Features).
timer           = ^+#t
timerToggle     = ^#x
; branchBuilder: draw a conversation as a tree, compile it back into a mass.
branchBuilder   = ^#b
; chatSim: the same mass as a chat transcript, editable in place — how many
; messages it really is, what pastes and what sends, what a branch changes.
chatSim         = ^+#c
; hotstringMenu: the pinned + recently-used hotstrings, as a popup at the
; cursor. Click one to send it; shift-click one to pin or unpin it.
hotstringMenu   = ^#h


; --- Recorder ----------------------------------------------------------------
[recorder]
toggle          = ^#F12


; --- Automation --------------------------------------------------------------
; Bound by Python, NOT AHK. Declared in hotkeys.ahk so this GUI can edit them, but
; nothing AHK-side binds them: they only fire while the listener is running.
; Start it silently (no console, like the AHK scripts) by double-clicking
;     pythonw src\services\runner\runner.pyw --start automation   (MMA does this itself)
; Stop / check:  python automation\automation.py --stop  (or --status)
; It logs to error_log.txt, re-reads this file live, and gates itself to the
; Infloww Messages window. Blank = disabled, same as everywhere else.
; unsendLast: unsends your bottom-most message. If your last run (everything sent
; since the fan's last reply) has more than one, a prompt appears - press the key
; again to unsend the whole run, tap Esc for just the last, HOLD Esc to cancel.
[automation]
unsendLast      = ^#u
countSales      = ^+#s


; --- Typelog -----------------------------------------------------------------
; Bound by Python (typelog.pyw), NOT AHK — same as [automation]. Only fires while
; the typelog recorder is running (Settings > Features > "Typelog", off by
; default). Pauses/resumes recording; press it before typing anything you would
; not want written to userdata\typelog\. Blank = no pause key.
[typelog]
pause           = ^#F9


; --- General -----------------------------------------------------------------
[general]
openFast        = !+=
openAndRate     = !+]
antiCc          = ^#a


; The [aliw] and [temp] sections lived here. Every one of those keys fired a
; function that only sent a canned message, so they are hotstrings now — see the
; note at the top of acc\ALIW.ahk. temp.fantasy was never bound to anything.


; --- Capitalizer -------------------------------------------------------------
; enterCap binds bare Enter, so nothing else may claim it.
[cap]
enterCap        = Enter
enterPass      = +Enter | ^Enter


; --- Mass: the ACTIVE model ---------------------------------------------------
;  ONE key set that follows whichever model is in front, so you never have to
;  remember that F9 is model 2. Which model that is comes from Settings ->
;  "Decide which model by": the screen detector (name / tab position), or your
;  own [mass.select] keys below.
;
;  This covers everything the numbered sections do, not just fu1-3 — a shared set
;  that could only send follow-ups would still leave you hunting for the right
;  numbered key for the PPV.
;
;  One action can carry several keys, separated by " | " WITH the spaces:
;  fu1 = F13 | ^F13 | XButton2. The mouse buttons are such overloads, and they
;  live here rather than under a model because XButton1 is under your thumb
;  whichever model is on screen.
;
;  F13-F24 are the Corsair Scimitar's twelve side buttons. F23/F24 belong to
;  [util], which leaves F16-F22 for the rest of this set.
[mass.active]
fu1             = F13 | ^F13 | XButton2
fu2             = F14 | ^F14 | XButton1
fu3             = F15 | ^F15 | ^MButton
ppv             = F16
ppvFus          = F17
mass            = F18
nextFu          = ^XButton2


; --- Mass: pick the active model ----------------------------------------------
;  Only needed when the screen detector cannot read your tab strip. Pressing one
;  of these says "I am on model N", switches Settings to manual, and shows a
;  tooltip to confirm; the [mass.active] keys above then follow that model until
;  you press another one.
;
;  It follows a TAB SWITCH ONLY IF YOU PRESS IT. That is the whole trade against
;  the detector, and the tooltip is there because the failure mode is silent.
[mass.select]
next            = ^#w
m1              = ^#F1
m2              = ^#F2
m3              = ^#F3

;  lock: one key, both ways. Locks the shared keys to whichever model is already
;  resolved (in "I pick" mode, the one you last selected), so they stop asking;
;  press it again — or click the badge it puts on screen — to unlock.
lock            = ^#F5


; --- Tab bars: vertical dividers on your own tab strip ------------------------
;  Pure decoration. A bar means whatever you meant by it; MMA never moves one and
;  never reads one.
;
;  ONE key: it places a bar at the pointer. Everything else is on the bar itself —
;  left-drag moves it, right-click opens its menu (remove · colour · size · add
;  another · hide the lot).
;
;  `star`, `sep`, `edit`, `remove` and `visible` were all keys here at some point and
;  are all gone (v2.1). Your hotkeys.ini keeps the stale lines; nothing reads them.
[marks]
bar             = ^#,
