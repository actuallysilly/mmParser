<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MMA Hotkeys</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
   hotkeys.html — the WebView2 face of MMA's hotkey editor.
  ───────────────────────────────────────────────────────────────────────────
   THIS PAGE DOES NOT READ THE KEYBOARD. It cannot: while a capture is running
   AHK has a system-wide InputHook up and the keystroke is swallowed before any
   window sees it. That is the whole reason a hotkey editor can be a web page
   at all — see the header of ui/hotkeys_webview.ahk. What this file draws is
   the picture: the rows, the keycaps, and the overlay that says "press a key".

   The one keydown handler at the bottom is for the page's OWN shortcuts
   (Ctrl+S, F12) and it is disabled outright while a capture is in flight, so
   there is never a moment where both this page and AHK think they are
   listening.

   This file owns NO list of hotkeys. Every row comes from the sync message,
   which is built from HK_ORDER / HK_META in core/hotkeys.ahk. Adding an
   HK_Def line puts a row on screen with no edit here.

   Nothing is written to hotkeys.ini until Save.

   The palette comes over the wire from core/theme.ahk, same as the other MMA
   pages, because a theme is a name in mass_gui.cfg that every process reads
   for itself.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --bg:#FEF7F9; --card:#FFFFFF; --text:#241E29; --dim:#8C7B86;
  --input-bg:#FFFFFF; --input-text:#241E29;
  --border:#EEDFE6; --border-strong:#DFCAD6;
  --accent:#6D28D9; --accent-ink:#FFFFFF; --accent-soft:rgba(109,40,217,.13);
  --hover:#F8EDF3; --radius:7px;
  --warn:#C2410C; --warn-soft:rgba(194,65,12,.11);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg); color:var(--text);
  font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;cursor:default;
}
input{-webkit-user-select:text;user-select:text;font:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;height:100vh}

/* ── the section rail ─────────────────────────────────────────────────────
   Seventeen features and ~140 keys. A tab strip cannot hold that; a list
   can, and it can carry a count per section so "which of these did I
   change" is answerable without opening each one. */
#rail{
  flex:0 0 214px;display:flex;flex-direction:column;
  background:var(--card);border-right:1px solid var(--border);padding:14px 0;
}
#rail h1{
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin:0 0 10px 18px;
}
#nav{overflow-y:auto;flex:1 1 auto}
.nav{
  padding:7px 14px 7px 18px;cursor:pointer;border-left:3px solid transparent;
  color:var(--text);font-size:13px;display:flex;align-items:center;gap:8px;
}
.nav:hover{background:var(--hover)}
.nav.on{border-left-color:var(--accent);background:var(--accent-soft);font-weight:600;color:var(--accent)}
.nav .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ct{flex:0 0 auto;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.nav.on .ct{color:var(--accent)}
.nav .dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent)}
#railfoot{margin-top:auto;padding:10px 18px 0;border-top:1px solid var(--border)}
#railfoot .lnk{
  display:block;width:100%;text-align:left;padding:6px 0;color:var(--dim);
  background:none;border:0;cursor:pointer;font:inherit;
}
#railfoot .lnk:hover{color:var(--accent);text-decoration:underline}

/* ── the pane ─────────────────────────────────────────────────────────── */
#pane{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#top{
  padding:14px 22px 11px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
#search{
  flex:1 1 240px;min-width:0;background:var(--input-bg);color:var(--input-text);
  border:1px solid var(--border-strong);border-radius:var(--radius);
  padding:7px 11px;outline:none;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#chips{display:flex;gap:6px;flex:0 0 auto}
.chip{
  border:1px solid var(--border-strong);background:var(--card);color:var(--dim);
  border-radius:20px;padding:5px 13px;cursor:pointer;font:inherit;font-size:12.5px;
}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.warn.on{background:var(--warn);border-color:var(--warn)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:5px}

#body{flex:1 1 auto;overflow-y:auto;padding:4px 22px 24px}
h2.grp{
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin:20px 0 2px;
}
h2.grp:first-child{margin-top:12px}

/* ── a row ────────────────────────────────────────────────────────────────
   The key is the thing you came to read, so it is a keycap and not a table
   cell of "^!F1". The row's buttons only appear on hover: at 140 rows, four
   permanent buttons each is 560 buttons of visual noise around the one
   column anybody is scanning. */
.row{
  display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--radius);
  border-bottom:1px solid var(--border);
}
.row:hover{background:var(--hover)}
.row.clashing{background:var(--warn-soft)}
.flag{flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:transparent}
.flag.edit{background:var(--accent)}
.flag.custom{box-shadow:inset 0 0 0 1.5px var(--border-strong)}
.rowtext{flex:1 1 auto;min-width:0}
.rowlabel{font-size:13.5px}
.rowsub{color:var(--dim);font-size:11.5px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctx{
  display:inline-block;padding:1px 7px;border-radius:9px;
  background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:600;
}
.clash{color:var(--warn);font-weight:600}

/* the keycap. A button, because clicking it is how you rebind — the most
   obvious target on the row is the thing you want to change. */
.keybtn{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;background:none;border:0;
  padding:3px;cursor:pointer;font:inherit;border-radius:var(--radius);
}
.keybtn:hover{box-shadow:0 0 0 2px var(--accent-soft)}
kbd{
  display:inline-block;min-width:26px;text-align:center;
  background:var(--card);border:1px solid var(--border-strong);
  border-bottom-width:2px;border-radius:5px;padding:3px 7px;
  font:600 12px/1 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  color:var(--text);
}
.row.clashing kbd{border-color:var(--warn);color:var(--warn)}
kbd.plus{border:0;background:none;min-width:0;padding:0 1px;color:var(--dim);font-weight:400}
.unbound{color:var(--dim);font-style:italic;padding:3px 7px;font-size:12.5px}
.acts{flex:0 0 auto;display:flex;gap:4px;width:118px;justify-content:flex-end;visibility:hidden}
.row:hover .acts{visibility:visible}
.mini{
  border:1px solid var(--border-strong);background:var(--card);color:var(--dim);
  border-radius:5px;padding:3px 9px;cursor:pointer;font:inherit;font-size:11.5px;
}
.mini:hover{background:var(--bg);color:var(--accent);border-color:var(--accent)}
.mini[disabled]{opacity:.35;cursor:default}
.mini[disabled]:hover{background:var(--card);color:var(--dim);border-color:var(--border-strong)}

/* ── the bar ──────────────────────────────────────────────────────────── */
#bar{
  border-top:1px solid var(--border);background:var(--card);
  padding:11px 22px;display:flex;align-items:center;gap:10px;
}
#dirty{color:var(--dim);font-size:12px;margin-right:auto}
#dirty.on{color:var(--accent);font-weight:600}
button.btn{
  border:1px solid var(--border-strong);background:var(--card);color:var(--text);
  border-radius:var(--radius);padding:8px 18px;cursor:pointer;font:inherit;
}
button.btn:hover{background:var(--hover)}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.btn.pri:hover{filter:brightness(1.08)}

#toast{
  position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(10px);
  background:var(--accent);color:var(--accent-ink);padding:9px 20px;border-radius:20px;
  font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:70vw;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#empty{color:var(--dim);padding:26px 2px}

/* ── the capture overlay ──────────────────────────────────────────────────
   Deliberately the loudest thing this page can draw. While it is up the
   keyboard AND the mouse belong to AHK: a click anywhere would be recorded
   as the new binding, so there is no Cancel button to click and the overlay
   has to say so in words rather than rely on one. */
#cap{
  position:fixed;inset:0;background:rgba(8,6,12,.72);
  display:none;align-items:center;justify-content:center;z-index:10;
}
#cap.on{display:flex}
#capbox{
  background:var(--card);border-radius:14px;padding:34px 46px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.5);min-width:400px;
}
#capsect{color:var(--dim);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
#caplabel{font-size:17px;margin-top:6px}
#capprompt{
  font-size:24px;font-weight:600;color:var(--accent);margin:22px 0 6px;
  min-height:32px;
}
#capcur{color:var(--dim);font-size:12.5px}
#caphelp{color:var(--dim);font-size:12.5px;margin-top:20px}
#caphelp kbd{margin:0 2px}
</style>
</head>
<body>
<div id="app">
  <div id="rail">
    <h1>Hotkeys</h1>
    <div id="nav"></div>
    <div id="railfoot">
      <button class="lnk" id="lnkIni">Open hotkeys.ini…</button>
      <button class="lnk" id="lnkResetAll">Reset every hotkey…</button>
      <button class="lnk" id="lnkRevert">Discard my edits</button>
    </div>
  </div>
  <div id="pane">
    <div id="top">
      <input id="search" type="text" placeholder="Search an action, a feature or a key" spellcheck="false">
      <div id="chips"></div>
    </div>
    <div id="body"></div>
    <div id="bar">
      <span id="dirty"></span>
      <button class="btn" id="btnClose">Close</button>
      <button class="btn pri" id="btnSave">Save</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<div id="cap">
  <div id="capbox">
    <div id="capsect"></div>
    <div id="caplabel"></div>
    <div id="capprompt">Press a key or mouse button…</div>
    <div id="capcur"></div>
    <div id="caphelp">
      <kbd>Esc</kbd> cancel &nbsp;·&nbsp; <kbd>Backspace</kbd> unbind
      <div style="margin-top:8px">Every MMA hotkey is held while this is up, so the key you press does not also fire. The mouse is being watched too — don't click.</div>
    </div>
  </div>
</div>

<script>
"use strict";

// Identical values to the main window's page and settings.html — see the note
// there. Same file on disk would be better and is the obvious next move; until
// then these must not be edited in one place only.
const THEMES = {
  pink: {bg:"#FEF7F9",card:"#FFFFFF",text:"#241E29",dim:"#8C7B86",inputBg:"#FFFFFF",
         inputText:"#241E29",border:"#EEDFE6",borderStrong:"#DFCAD6",accent:"#6D28D9",
         accentInk:"#FFFFFF",accentSoft:"rgba(109,40,217,.13)",hover:"#F8EDF3",scheme:"light"},
  dark: {bg:"#1E1D26",card:"#26242F",text:"#FFFFFF",dim:"#A7A2B8",inputBg:"#2A2833",
         inputText:"#FFFFFF",border:"#332F3F",borderStrong:"#403B4E",accent:"#B89CFF",
         accentInk:"#1B1A24",accentSoft:"rgba(184,156,255,.16)",hover:"#2E2B39",scheme:"dark"},
  classic:{bg:"#F3F3F3",card:"#FFFFFF",text:"#1A1A1A",dim:"#6B6B6B",inputBg:"#FFFFFF",
         inputText:"#1A1A1A",border:"#E1E1E1",borderStrong:"#CDCDCD",accent:"#3B5BDB",
         accentInk:"#FFFFFF",accentSoft:"rgba(59,91,219,.13)",hover:"#EAEAEA",scheme:"light"}
};
function applyTheme(name){
  const t = THEMES[name] || THEMES.pink, r = document.documentElement.style;
  r.setProperty("--bg",t.bg); r.setProperty("--card",t.card);
  r.setProperty("--text",t.text); r.setProperty("--dim",t.dim);
  r.setProperty("--input-bg",t.inputBg); r.setProperty("--input-text",t.inputText);
  r.setProperty("--border",t.border); r.setProperty("--border-strong",t.borderStrong);
  r.setProperty("--accent",t.accent); r.setProperty("--accent-ink",t.accentInk);
  r.setProperty("--accent-soft",t.accentSoft); r.setProperty("--hover",t.hover);
  // The clash colour has to survive a dark background; the light one goes muddy.
  r.setProperty("--warn", t.scheme === "dark" ? "#FF9E6B" : "#C2410C");
  r.setProperty("--warn-soft", t.scheme === "dark" ? "rgba(255,158,107,.13)" : "rgba(194,65,12,.09)");
  document.documentElement.style.colorScheme = t.scheme;
}

const $ = (id) => document.getElementById(id);
function post(m){ if(window.chrome && window.chrome.webview) window.chrome.webview.postMessage(m); }

// The last state AHK sent. The only copy — every handler reads it rather than
// keeping its own, so what is on screen and what will be saved cannot disagree.
let S = null;
let section = "";       // "" = every section at once
let query = "";
let filter = "all";     // all | changed | clashes | unbound
let capturing = false;

// ── what the filters mean ────────────────────────────────────────────────────
// One function, so the chip counts and the list can never disagree about which
// rows a filter lets through — which is the bug where a chip says "3" and
// clicking it shows four rows.
function passesFilter(r){
  if(filter === "changed") return r.flag !== "";
  if(filter === "clashes") return !!r.clash;
  if(filter === "unbound") return r.key === "";
  return true;
}
function matches(r){
  if(!query) return true;
  const q = query.toLowerCase();
  return (r.label||"").toLowerCase().includes(q)
      || (r.id||"").toLowerCase().includes(q)
      || (r.pretty||"").toLowerCase().includes(q)
      || (r.owner||"").toLowerCase().includes(q)
      || (sectLabel(r.sect)||"").toLowerCase().includes(q);
}
function sectLabel(id){
  if(!S) return id;
  const s = S.sections.find(x => x.id === id);
  return s ? s.label : id;
}
// Rows the list should show, given all three of section / search / chip.
// Searching or picking a chip other than All drops the section restriction:
// "show me every clash" that only showed one feature's clashes would be
// answering a question nobody asked.
function visibleRows(){
  if(!S) return [];
  const wide = query !== "" || filter !== "all";
  return S.rows.filter(r => passesFilter(r) && matches(r)
                       && (wide || !section || r.sect === section));
}

function buildNav(){
  const nav = $("nav");
  nav.textContent = "";
  const mk = (id, label, count, edited) => {
    const d = document.createElement("div");
    d.className = "nav" + (id === section && !query && filter === "all" ? " on" : "");
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = label;
    d.appendChild(nm);
    if(edited){ const dot = document.createElement("span"); dot.className = "dot"; d.appendChild(dot); }
    const ct = document.createElement("span"); ct.className = "ct"; ct.textContent = count;
    d.appendChild(ct);
    d.onclick = () => { query=""; $("search").value=""; filter="all"; section=id; render(); };
    nav.appendChild(d);
  };
  mk("", "Everything", S.rows.length, S.rows.some(r => r.flag === "edit"));
  for(const s of S.sections){
    const rows = S.rows.filter(r => r.sect === s.id);
    if(!rows.length) continue;
    mk(s.id, s.label, rows.length, rows.some(r => r.flag === "edit"));
  }
}

function buildChips(){
  const box = $("chips");
  box.textContent = "";
  const defs = [
    ["all",     "All",         S.rows.length,                            false],
    ["changed", "Changed",     S.rows.filter(r => r.flag !== "").length,  false],
    ["clashes", "Clashes",     S.counts.clashes,                          true ],
    ["unbound", "Unassigned",  S.counts.off,                              false]
  ];
  for(const [id, label, n, warn] of defs){
    const b = document.createElement("button");
    b.className = "chip" + (filter === id ? " on" : "") + (warn ? " warn" : "");
    b.textContent = label;
    const c = document.createElement("span"); c.className = "n"; c.textContent = n;
    b.appendChild(c);
    b.onclick = () => { filter = (filter === id ? "all" : id); render(); };
    box.appendChild(b);
  }
}

function keycaps(r){
  const btn = document.createElement("button");
  btn.className = "keybtn";
  btn.title = "Click to assign a new key";
  if(!r.tokens.length){
    const s = document.createElement("span");
    s.className = "unbound"; s.textContent = "not assigned";
    btn.appendChild(s);
  } else {
    r.tokens.forEach((t, i) => {
      if(i){ const p = document.createElement("kbd"); p.className="plus"; p.textContent="+"; btn.appendChild(p); }
      const k = document.createElement("kbd"); k.textContent = t; btn.appendChild(k);
    });
  }
  btn.onclick = () => post({cmd:"assign", id:r.id});
  return btn;
}

function buildRow(r){
  const row = document.createElement("div");
  row.className = "row" + (r.clash ? " clashing" : "");

  const fl = document.createElement("div");
  fl.className = "flag" + (r.flag ? " " + r.flag : "");
  fl.title = r.flag === "edit" ? "Edited — not saved yet"
           : r.flag === "custom" ? "Not the default" : "";
  row.appendChild(fl);

  const tx = document.createElement("div"); tx.className = "rowtext";
  const lab = document.createElement("div"); lab.className = "rowlabel";
  lab.textContent = r.label;
  tx.appendChild(lab);

  const sub = document.createElement("div"); sub.className = "rowsub";
  if(r.when){
    const c = document.createElement("span");
    c.className = "ctx"; c.textContent = "only in " + r.when;
    sub.appendChild(c);
  }
  if(r.clash){
    const c = document.createElement("span");
    c.className = "clash"; c.textContent = "⚠ same key as " + r.clash;
    sub.appendChild(c);
  } else {
    // The id, not the owner script: the id is what hotkeys.ini calls this row,
    // and hand-editing the ini is a supported path. Knowing which line to go
    // and change is worth more here than knowing which .ahk binds it.
    const c = document.createElement("span");
    c.textContent = r.id + (r.owner ? "  ·  " + r.owner : "");
    sub.appendChild(c);
  }
  tx.appendChild(sub);
  row.appendChild(tx);

  row.appendChild(keycaps(r));

  const acts = document.createElement("div"); acts.className = "acts";
  const def = document.createElement("button");
  def.className = "mini"; def.textContent = "Default";
  def.title = r.hasDef ? ("Back to " + r.defLabel) : "This one has no default";
  if(!r.hasDef) def.disabled = true;
  else def.onclick = () => post({cmd:"reset", id:r.id});
  acts.appendChild(def);

  const clr = document.createElement("button");
  clr.className = "mini"; clr.textContent = "Unbind";
  clr.title = "Leave this action with no key at all";
  if(r.key === "") clr.disabled = true;
  else clr.onclick = () => post({cmd:"clear", id:r.id});
  acts.appendChild(clr);

  row.appendChild(acts);
  return row;
}

function render(){
  if(!S) return;
  applyTheme(S.theme);
  buildNav();
  buildChips();

  const body = $("body");
  body.textContent = "";
  const rows = visibleRows();

  if(!rows.length){
    const e = document.createElement("div");
    e.id = "empty";
    e.textContent = query ? ("Nothing matches “" + query + "”.")
                 : filter === "clashes" ? "No two keys clash. "
                 : filter === "changed" ? "Nothing is off its default."
                 : filter === "unbound" ? "Every action has a key."
                 : "Nothing here.";
    body.appendChild(e);
  } else {
    // Headings whenever more than one feature is on screen, which is any time
    // the list is not pinned to a single section.
    const grouped = (section === "" || query !== "" || filter !== "all");
    let group = null;
    for(const r of rows){
      if(grouped && r.sect !== group){
        group = r.sect;
        const h = document.createElement("h2");
        h.className = "grp"; h.textContent = sectLabel(r.sect);
        body.appendChild(h);
      }
      body.appendChild(buildRow(r));
    }
  }

  // Counts the WHOLE registry, not the filtered view: "3 unsaved" dropping to 0
  // because you typed in the search box would be a lie about the one thing this
  // line is here to warn you about.
  const d = $("dirty");
  d.textContent = S.counts.edits
      ? (S.counts.edits + " unsaved change" + (S.counts.edits === 1 ? "" : "s"))
      : (S.counts.clashes ? (S.counts.clashes + " key(s) clash") : "");
  d.className = S.counts.edits ? "on" : "";
}

$("search").oninput   = (e) => { query = e.target.value.trim(); render(); };
$("btnSave").onclick   = () => post({cmd:"save"});
$("btnClose").onclick  = () => post({cmd:"close"});
$("lnkIni").onclick    = () => post({cmd:"openIni"});
$("lnkResetAll").onclick = () => post({cmd:"resetAll"});
$("lnkRevert").onclick = () => post({cmd:"revert"});

// The page's own shortcuts — and only its own. Dead while a capture is running:
// AHK's InputHook already swallows the keystroke, so this would never fire
// anyway, but leaving it armed would mean two things believing they are the one
// listening, which is exactly the confusion this design avoids.
document.addEventListener("keydown", (e) => {
  if(capturing) return;
  if(e.key === "F12"){ post({cmd:"devtools"}); return; }
  if(e.key === "Escape"){ post({cmd:"close"}); return; }
  if(e.key === "s" && e.ctrlKey){ e.preventDefault(); post({cmd:"save"}); }
});

let toastTimer = 0;
window.mma = {
  sync(state){ S = state; render(); },

  // AHK drives this: on when the grab starts, off when it returns. The page
  // never decides for itself that a capture is over.
  capture(c){
    capturing = !!c.on;
    const box = $("cap");
    if(!c.on){ box.className = ""; return; }
    $("capsect").textContent  = c.section || "";
    $("caplabel").textContent = c.label || "";
    $("capcur").textContent   = "currently " + (c.current || "");
    $("capprompt").textContent = "Press a key or mouse button…";
    box.className = "on";
  },

  // The chord as it builds, so holding Ctrl visibly does something. Sent only
  // when the text actually changes — see HWV_Prompt in hotkeys_webview.ahk.
  prompt(text){ $("capprompt").textContent = text; },

  toast(text){
    const t = $("toast");
    t.textContent = text; t.className = "on";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ""; }, 2400);
  }
};

post({cmd:"ready"});
</script>
</body>
</html>
