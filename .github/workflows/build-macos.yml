name: Build macOS app

# PyInstaller cannot cross-compile, and there is no Mac in this project's dev
# setup — so the .app/.dmg is built here, on GitHub's macOS runners.
#
# Download the .dmg from the run's Artifacts, unzip, and send it on.

on:
  # The Actions-tab button. Note it only appears once this file is on the
  # DEFAULT branch — on a feature branch the push trigger below is what runs.
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      # Only when something that changes the app changes. Editing the AHK build
      # or the changelog should not spend minutes on a macOS runner.
      - "portable/**"
      - ".github/workflows/build-macos.yml"
    tags:
      - "v*"

# A superseded run is just burning a runner. This also clears anything stuck in
# the queue when a new push lands.
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Apple Silicon only, deliberately. An Intel (macos-13) job was tried and
    # never got allocated a runner — those images are being retired. If an
    # Intel Mac ever needs supporting, add a job on a current Intel label
    # rather than resurrecting macos-13.
    #
    # The result is arm64-only: it runs on any M1 or later, and NOT on an
    # Intel Mac, where it fails with "the application cannot be opened".
    runs-on: macos-14
    name: AppleSilicon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: portable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        working-directory: portable
        # The GUI tests need a display; without one they skip themselves. The
        # engine, parser and settings tests are the ones that matter here.
        run: python -m unittest discover -v

      - name: Build
        working-directory: portable
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Name the artifact by architecture
        working-directory: portable
        # The recipient has to know which Mac it is for, so the architecture
        # stays in the filename rather than only in the run.
        run: mv dist/MMA.dmg dist/MMA-AppleSilicon.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MMA-AppleSilicon
          path: portable/dist/MMA-AppleSilicon.dmg
          if-no-files-found: error
          retention-days: 30
