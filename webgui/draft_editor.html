<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMA · Draft Editor</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #232323;
    --panel2: #1e1e1e;
    --border: rgba(255,255,255,.12);
    --text: #eee;
    --muted: #9aa0a6;
    --accent: #7aa2f7;
    --accent2: #f7a27a;
    --good: #7ad08a;
    --warn: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  /* ── toolbar ── */
  #toolbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: #151515; border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  #toolbar .title { font-weight: 600; letter-spacing: .3px; margin-right: 6px; }
  #toolbar .title .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
  #toolbar .spacer { flex: 1; }
  #toolbar a, #toolbar button {
    background: #2b2b2b; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 11px; font-size: 12.5px; cursor: pointer;
    text-decoration: none; font-family: inherit;
  }
  #toolbar a:hover, #toolbar button:hover { background: #383838; }
  #toolbar a.nav { background: transparent; color: var(--muted); }
  #toolbar a.nav:hover { color: var(--text); background: #2b2b2b; }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }

  /* ── layout ── */
  #main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 240px; background: var(--panel2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  #sidebar .head { padding: 10px 12px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; display:flex; justify-content:space-between; align-items:center; }
  #draftList { flex: 1; overflow: auto; padding: 4px 6px; }
  .draft-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
    display: flex; flex-direction: column; gap: 2px; margin-bottom: 2px;
  }
  .draft-item:hover { background: #262626; }
  .draft-item.active { background: #26364d; border-color: rgba(122,162,247,.4); }
  .draft-item .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .draft-item .meta { font-size: 11px; color: var(--muted); }
  .draft-item .row { display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
  .draft-item .del { color:#e88; opacity:0; font-size:14px; background:none;border:none;cursor:pointer;padding:0 2px; }
  .draft-item:hover .del { opacity:.7; }
  .draft-item .del:hover { opacity:1; }
  #sidebar .empty { color: var(--muted); font-size: 12px; padding: 14px 12px; line-height: 1.5; }

  /* ── editor ── */
  #editor { flex: 1; display: flex; min-height: 0; }
  #form { flex: 1.1; overflow: auto; padding: 16px 18px; min-width: 0; }
  #previewPane {
    flex: 1; background: var(--panel2); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
  }

  .name-row { display:flex; gap:10px; align-items:center; margin-bottom: 14px; }
  .name-row input.dname { flex:1; font-size: 15px; font-weight: 600; }
  .name-row input.model { width: 120px; }

  fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; background: var(--panel); }
  legend { padding: 0 6px; color: var(--accent); font-size: 12.5px; font-weight: 600; letter-spacing: .3px; }
  legend.ppv { color: var(--accent2); }
  label { display: block; font-size: 11.5px; color: var(--muted); margin: 8px 0 3px; }
  label:first-of-type { margin-top: 2px; }
  .sub-label { color: #7f858b; }

  input, textarea, select {
    width: 100%; background: #141414; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 9px;
    font-family: inherit; font-size: 13px; resize: vertical;
  }
  textarea { min-height: 46px; line-height: 1.45; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .grid3 { display: grid; grid-template-columns: 1fr; gap: 2px; }

  /* ── preview ── */
  #previewPane .head {
    padding: 10px 12px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .6px; border-bottom: 1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center;
  }
  #warnings { padding: 8px 12px; font-size: 12px; color: var(--warn); white-space: pre-wrap; line-height:1.5; border-bottom: 1px solid var(--border); display:none; }
  #output {
    flex: 1; min-height: 0; margin: 0; padding: 12px; width: 100%; resize: none;
    border: none; border-radius: 0; outline: none;
    font-family: Consolas, "Courier New", monospace; font-size: 12.5px; line-height: 1.5;
    color: #cfe3ff; background: #101317;
  }
  #output:focus { box-shadow: inset 2px 0 0 var(--accent); }
  button.act:disabled { opacity: .4; cursor: default; }
  #btnRebuild { padding: 4px 9px; font-size: 11.5px; }
  #actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
  #actions button { flex: 0 0 auto; }
  button.act {
    background: #2b2b2b; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  button.act:hover { background: #383838; }
  button.act.primary { background: #2a4d7a; border-color: rgba(122,162,247,.5); }
  button.act.primary:hover { background: #34608f; }
  #status { font-size: 12px; color: var(--muted); margin-left: auto; }
  #status.ok { color: var(--good); }
  #status.err { color: #e88; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }
</style>
</head>
<body>
  <div id="toolbar">
    <span class="title">MMA · Draft Editor <span class="sub">compose &amp; save masses, one-click into MMA</span></span>
    <span class="spacer"></span>
    <button id="btnNew">+ New draft</button>
    <button id="btnSave">Save draft</button>
    <span class="sep"></span>
    <button id="btnExport">Export .json</button>
    <button id="btnImport">Import .json</button>
    <input type="file" id="fileJson" accept=".json,application/json" hidden>
    <span class="sep"></span>
    <a class="nav" href="archive_viewer.html">Archive ▸</a>
    <a class="nav" href="branching_editor.html">Branching ▸</a>
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="head"><span>Saved drafts</span></div>
      <div id="draftList"></div>
    </div>

    <div id="editor">
      <div id="form">
        <div class="name-row">
          <input class="dname" id="fName" placeholder="Draft name (e.g. Iron Throne opener)">
          <input class="model" id="fModel" placeholder="Model (opt.)" title="Optional label — which model this draft is for">
        </div>

        <fieldset>
          <legend>Mass — !mma</legend>
          <label>The mass message itself (what follows <code>!mma</code>)</label>
          <textarea id="fMass" data-f="mass" placeholder="Does your tongue vibrate?"></textarea>
        </fieldset>

        <fieldset>
          <legend>Follow-up 1</legend>
          <div class="grid3">
            <label>fu1</label>       <textarea data-f="fu1"></textarea>
            <label class="sub-label">fu1.5 <span>(optional extra line)</span></label> <textarea data-f="fu15"></textarea>
            <label class="sub-label">fu1.7 <span>(optional extra line)</span></label> <textarea data-f="fu17"></textarea>
          </div>
        </fieldset>

        <fieldset>
          <legend>Follow-up 2</legend>
          <div class="grid3">
            <label>fu2</label>       <textarea data-f="fu2"></textarea>
            <label class="sub-label">fu2.5</label> <textarea data-f="fu25"></textarea>
            <label class="sub-label">fu2.7</label> <textarea data-f="fu27"></textarea>
          </div>
        </fieldset>

        <fieldset>
          <legend>Follow-up 3</legend>
          <div class="grid3">
            <label>fu3</label>       <textarea data-f="fu3"></textarea>
            <label class="sub-label">fu3.5</label> <textarea data-f="fu35"></textarea>
            <label class="sub-label">fu3.7</label> <textarea data-f="fu37"></textarea>
          </div>
        </fieldset>

        <fieldset>
          <legend class="ppv">PPV</legend>
          <label>PPV message (the ppv unlock text — multi-line is fine)</label>
          <textarea data-f="ppv" style="min-height:80px"></textarea>
          <label>ppv follow-up 1 <span class="sub-label">(sent after the ppv opens)</span></label> <textarea data-f="ppvfu1"></textarea>
          <label>ppv follow-up 2</label> <textarea data-f="ppvfu2"></textarea>
          <label>ppv follow-up 3</label> <textarea data-f="ppvfu3"></textarea>
        </fieldset>
      </div>

      <div id="previewPane">
        <div class="head">
          <span>MMA output — editable</span>
          <button class="act" id="btnRebuild" title="Discard raw edits and rebuild from the fields on the left" disabled>↻ from fields</button>
        </div>
        <div id="warnings"></div>
        <textarea id="output" spellcheck="true" placeholder="Write your whole mass here — or fill the fields on the left and it builds itself.

!mma your opener…

first follow-up

second follow-up

ppv
the ppv message (multi-line is fine)"></textarea>
        <div id="actions">
          <button class="act primary" id="btnSend" title="Copies with an import tag; MMA grabs it automatically (MMA must be running)">Send to MMA ▸</button>
          <button class="act" id="btnCopy" title="Plain copy — paste into MMA's paste box yourself">Copy for MMA</button>
          <span id="status"></span>
        </div>
      </div>
    </div>
  </div>

<script>
"use strict";

const STORE = "mma_drafts_v1";
const SENTINEL = "#MMA-IMPORT#";
const FIELDS = ["mass","fu1","fu15","fu17","fu2","fu25","fu27","fu3","fu35","fu37","ppv","ppvfu1","ppvfu2","ppvfu3"];

// ── persistence ──────────────────────────────────────────────────────────────
function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; }
}
function save(state) { localStorage.setItem(STORE, JSON.stringify(state)); }

let state = load();
if (!state.drafts) state.drafts = [];        // [{id,name,model,fields,updated}]
if (!state.current) state.current = blankDraft();  // working copy (unsaved edits live here)
let activeId = state.activeId || null;

function blankDraft() {
  const f = {}; FIELDS.forEach(k => f[k] = "");
  return { name: "", model: "", fields: f, raw: "" };
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// ── DOM refs ─────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const fName = $("#fName"), fModel = $("#fModel");
const output = $("#output"), warnings = $("#warnings"), statusEl = $("#status");
const draftList = $("#draftList"), btnRebuild = $("#btnRebuild");
const fieldEls = {};
document.querySelectorAll("[data-f]").forEach(el => fieldEls[el.dataset.f] = el);
let rawDirty = false;   // true once the output box is hand-edited → the raw text wins over the fields

// ── read the form / load a draft ─────────────────────────────────────────────
function readFields() {
  const f = {};
  FIELDS.forEach(k => f[k] = (fieldEls[k] ? fieldEls[k].value : ""));
  return f;
}
function currentDraft() {
  return { name: fName.value.trim(), model: fModel.value.trim(), fields: readFields(), raw: output.value };
}
// load a draft into the form + the editable output box
function loadDraft(d) {
  fName.value = d.name || "";
  fModel.value = d.model || "";
  FIELDS.forEach(k => { if (fieldEls[k]) fieldEls[k].value = (d.fields && d.fields[k]) || ""; });
  const built = buildMMA(readFields());
  if (d.raw !== undefined && d.raw !== null && d.raw !== "") {
    output.value = d.raw;
    rawDirty = (d.raw !== built);        // raw differs from what the fields produce → treat as a hand-edit
  } else {
    output.value = built;
    rawDirty = false;
  }
  updateWarnings(); updateRebuildBtn(); persist();
}
function previewOf(d) {
  let s = esc(d.fields && d.fields.mass ? d.fields.mass : "");
  if (!s && d.raw) {
    for (const ln of d.raw.split("\n")) { const t = ln.trim(); if (t) { s = t.replace(/^!?mm[a]?\s+/i, ""); break; } }
  }
  return s.replace(/\n+/g, " ").slice(0, 60) || "(no mass)";
}

// ── build MMA positional text (verified against FillTab) ─────────────────────
function esc(s) { return (s || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").replace(/\s+$/g, "").replace(/^\s+/g, ""); }

function buildMMA(f) {
  const out = [];
  const mass = esc(f.mass).replace(/\n+/g, " ").trim();   // mass must be a single line
  if (mass) out.push("!mma " + mass);

  const groups = [["fu1","fu15","fu17"], ["fu2","fu25","fu27"], ["fu3","fu35","fu37"]];
  for (const g of groups) {
    const lines = [];
    for (const k of g) { const v = esc(f[k]); if (v) lines.push(v); }
    if (lines.length) { out.push(""); out.push(lines.join("\n")); }
  }

  const ppv = esc(f.ppv);
  if (ppv) {
    out.push("");
    out.push("ppv");        // lone marker line: detected as ppv, keeps multi-line, avoids keyword-mode
    out.push(ppv);
    const pf = [];
    for (const k of ["ppvfu1","ppvfu2","ppvfu3"]) { const v = esc(f[k]); if (v) pf.push(v); }
    if (pf.length) { out.push(""); out.push(pf.join("\n")); }
  }
  return out.join("\n");
}

// warnings for cases the positional parser can't represent faithfully
function buildWarnings(f) {
  const w = [];
  const holes = [
    [["fu1","fu15","fu17"], "fu1"], [["fu2","fu25","fu27"], "fu2"], [["fu3","fu35","fu37"], "fu3"],
  ];
  for (const [g, name] of holes) {
    const filled = g.map(k => !!esc(f[k]));
    if (!filled[0] && (filled[1] || filled[2]))
      w.push(`⚠ ${name} is empty but a sub-line (${name}.5/.7) is filled — it will shift up into the ${name} slot.`);
    else if (filled[0] && !filled[1] && filled[2])
      w.push(`⚠ ${name}.5 is empty but ${name}.7 is filled — ${name}.7 will import into the ${name}.5 slot. Fill ${name}.5 or clear ${name}.7.`);
  }
  const pf = ["ppvfu1","ppvfu2","ppvfu3"].map(k => !!esc(f[k]));
  if (!esc(f.ppv) && pf.some(Boolean))
    w.push("⚠ ppv follow-ups are set but the PPV message is empty — they need a ppv message and won't be exported.");
  else if (esc(f.ppv)) {
    if (!pf[0] && (pf[1] || pf[2])) w.push("⚠ ppvfu1 empty but a later ppv follow-up is filled — it will shift up.");
    else if (pf[0] && !pf[1] && pf[2]) w.push("⚠ ppvfu2 empty but ppvfu3 filled — ppvfu3 will import into the ppvfu2 slot.");
  }
  return w;
}

// ── sync / render ─────────────────────────────────────────────────────────────
// a field changed: rebuild the output from the fields — unless the user has taken
// the box over by hand-editing it, in which case their text wins and we leave it.
function syncFromFields() {
  if (!rawDirty) output.value = buildMMA(readFields());
  updateWarnings(); persist();
}
function updateWarnings() {
  const w = rawDirty ? [] : buildWarnings(readFields());  // warnings describe the fields; only meaningful in field mode
  if (w.length) { warnings.style.display = "block"; warnings.textContent = w.join("\n"); }
  else { warnings.style.display = "none"; }
}
function updateRebuildBtn() { btnRebuild.disabled = !rawDirty; }
function persist() { state.current = currentDraft(); save(state); }

function renderList() {
  draftList.innerHTML = "";
  if (!state.drafts.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No saved drafts yet. Fill in the form and hit “Save draft” to keep one for reuse.";
    draftList.appendChild(e);
    return;
  }
  const sorted = [...state.drafts].sort((a, b) => (b.updated || 0) - (a.updated || 0));
  for (const d of sorted) {
    const item = document.createElement("div");
    item.className = "draft-item" + (d.id === activeId ? " active" : "");
    const preview = previewOf(d);
    item.innerHTML =
      `<div class="row"><span class="name"></span><button class="del" title="Delete">✕</button></div>
       <div class="meta"></div>`;
    item.querySelector(".name").textContent = d.name || "(untitled)";
    item.querySelector(".meta").textContent = (d.model ? d.model + " · " : "") + preview;
    item.addEventListener("click", e => {
      if (e.target.classList.contains("del")) return;
      activeId = d.id; state.activeId = activeId;
      loadDraft(d); renderList();
    });
    item.querySelector(".del").addEventListener("click", e => {
      e.stopPropagation();
      if (!confirm(`Delete draft “${d.name || "untitled"}”?`)) return;
      state.drafts = state.drafts.filter(x => x.id !== d.id);
      if (activeId === d.id) { activeId = null; state.activeId = null; }
      save(state); renderList();
    });
    draftList.appendChild(item);
  }
}

// ── clipboard ────────────────────────────────────────────────────────────────
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
  } catch (e) { return false; }
}
let statusTimer = null;
function flash(msg, cls) {
  statusEl.textContent = msg; statusEl.className = cls || "";
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { statusEl.textContent = ""; statusEl.className = ""; }, 4000);
}

// ── actions ──────────────────────────────────────────────────────────────────
$("#btnCopy").addEventListener("click", async () => {
  const txt = output.value.trim();
  if (!txt) return flash("Nothing to copy", "err");
  const ok = await copyText(txt);
  flash(ok ? "Copied — paste into MMA's box + Parse" : "Copy failed", ok ? "ok" : "err");
});
$("#btnSend").addEventListener("click", async () => {
  const txt = output.value.trim();
  if (!txt) return flash("Nothing to send", "err");
  const ok = await copyText(SENTINEL + "\n" + txt);
  flash(ok ? "Sent → MMA should grab it (must be running)" : "Copy failed", ok ? "ok" : "err");
});

$("#btnNew").addEventListener("click", () => {
  activeId = null; state.activeId = null;
  loadDraft(blankDraft()); renderList(); fName.focus();
});
$("#btnSave").addEventListener("click", () => {
  const d = currentDraft();
  if (!d.name) { flash("Give the draft a name first", "err"); fName.focus(); return; }
  const existing = state.drafts.find(x => x.id === activeId);
  if (existing) { Object.assign(existing, d, { updated: Date.now() }); }
  else { const nd = { id: uid(), ...d, updated: Date.now() }; state.drafts.push(nd); activeId = nd.id; state.activeId = activeId; }
  save(state); renderList(); flash("Saved", "ok");
});
$("#btnRebuild").addEventListener("click", () => {
  const built = buildMMA(readFields());
  if (!built && output.value.trim() && !confirm("The fields are empty — rebuilding will clear the text you wrote. Continue?")) return;
  output.value = built; rawDirty = false;
  updateWarnings(); updateRebuildBtn(); persist();
});

// export / import .json
$("#btnExport").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ drafts: state.drafts }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mma_drafts.json"; a.click(); URL.revokeObjectURL(a.href);
});
$("#btnImport").addEventListener("click", () => $("#fileJson").click());
$("#fileJson").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const incoming = Array.isArray(data) ? data : (data.drafts || []);
      let added = 0;
      for (const d of incoming) {
        if (!d || (!d.fields && !d.raw)) continue;
        const f = {}; FIELDS.forEach(k => f[k] = (d.fields && d.fields[k]) || "");
        state.drafts.push({ id: uid(), name: d.name || "imported", model: d.model || "", fields: f, raw: d.raw || "", updated: Date.now() });
        added++;
      }
      save(state); renderList(); flash(`Imported ${added} draft${added === 1 ? "" : "s"}`, "ok");
    } catch (err) { flash("Invalid .json", "err"); }
  };
  r.readAsText(file);
  e.target.value = "";
});

// ── wire up live editing ─────────────────────────────────────────────────────
Object.values(fieldEls).forEach(el => el.addEventListener("input", syncFromFields));
[fName, fModel].forEach(el => el.addEventListener("input", persist));        // name/model don't affect output
output.addEventListener("input", () => { rawDirty = true; updateWarnings(); updateRebuildBtn(); persist(); });
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); $("#btnSend").click(); }
  if (e.ctrlKey && e.key.toLowerCase() === "s") { e.preventDefault(); $("#btnSave").click(); }
});

// ── init: restore active draft or working copy ───────────────────────────────
(function init() {
  const act = state.drafts.find(x => x.id === activeId);
  loadDraft(act || state.current || blankDraft());
  renderList();
})();
</script>
</body>
</html>
