<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b11; --bg-2:#0e0e15;
  --panel:rgba(22,22,32,.66); --panel-solid:#14141d;
  --field:#0a0a10; --stroke:rgba(150,142,205,.13); --stroke-2:rgba(160,150,220,.24);
  --text:#eceaf4; --dim:#a29fbb; --mute:#6b687f;
  --accent:#7c5cff; --accent-2:#26d9df; --accent-soft:rgba(124,92,255,.14);
  --good:#39e0a2; --grad:linear-gradient(120deg,#8b6bff,#26d9df);
  --f-brand:"Chakra Petch",sans-serif; --f-ui:"Manrope",system-ui,sans-serif; --f-mono:"JetBrains Mono",monospace;
  --tb:40px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-ui);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:13px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 500px at 100% 0%,rgba(124,92,255,.10),transparent 55%),
  radial-gradient(700px 500px at 0% 100%,rgba(38,217,223,.06),transparent 55%),var(--bg)}
#bg::after{content:"";position:absolute;inset:0;opacity:.4;
  background-image:linear-gradient(rgba(150,142,210,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(150,142,210,.04) 1px,transparent 1px);
  background-size:40px 40px;-webkit-mask-image:radial-gradient(circle at 70% 20%,#000,transparent 85%);mask-image:radial-gradient(circle at 70% 20%,#000,transparent 85%)}
::selection{background:rgba(124,92,255,.34)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(150,142,210,.16);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(150,142,210,.28)}

#shell{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}

/* titlebar */
#titlebar{height:var(--tb);flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 6px 0 14px;
  background:rgba(10,10,16,.6);border-bottom:1px solid var(--stroke);backdrop-filter:blur(12px);-webkit-app-region:drag}
.brand{display:flex;align-items:center;gap:9px}
.brand .logo{width:24px;height:24px;border-radius:7px;background:var(--grad);display:grid;place-items:center;
  font-family:var(--f-brand);font-weight:700;font-size:12px;color:#0a0a12;box-shadow:0 3px 12px rgba(124,92,255,.5)}
.brand b{font-family:var(--f-brand);font-weight:600;font-size:13px;letter-spacing:.5px}
.brand .ver{font-family:var(--f-mono);font-size:10px;color:var(--mute);margin-top:1px}
.tb-status{display:flex;align-items:center;gap:7px;margin-left:8px;padding:3px 10px;border-radius:20px;
  background:rgba(57,224,162,.09);border:1px solid rgba(57,224,162,.24)}
.tb-status .d{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.tb-status span{font-family:var(--f-mono);font-size:10px;letter-spacing:1px;color:var(--good)}
.tb-space{flex:1}
.wbtn{width:38px;height:var(--tb);display:grid;place-items:center;color:var(--dim);cursor:pointer;-webkit-app-region:no-drag;transition:.15s}
.wbtn:hover{background:rgba(255,255,255,.06);color:var(--text)}
.wbtn.close:hover{background:#e5484d;color:#fff}
.wbtn svg{width:13px;height:13px}

/* body */
#body{flex:1;display:grid;grid-template-columns:1.28fr 1fr;gap:1px;min-height:0;background:var(--stroke)}
.col{background:var(--bg);min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* tabs */
.tabs{display:flex;gap:4px;padding:14px 16px 0;flex:0 0 auto}
.tab{padding:8px 16px;border-radius:9px 9px 0 0;font-weight:600;font-size:12.5px;color:var(--mute);cursor:pointer;position:relative;transition:.18s;border:1px solid transparent;border-bottom:none}
.tab:hover{color:var(--dim)}
.tab.on{color:var(--text);background:var(--panel);border-color:var(--stroke)}
.tab.on::after{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:2px;background:var(--grad)}

/* field form */
.form{flex:1;overflow-y:auto;padding:18px 20px 24px;border-top:1px solid var(--stroke);margin-top:-1px}
.frow{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:12px;margin-bottom:9px}
.frow.gap{margin-bottom:18px}
.frow label{font-family:var(--f-mono);font-size:11px;color:var(--dim);text-align:right;letter-spacing:.3px}
.frow.key label{color:var(--accent-2)}
.frow input,.frow textarea{width:100%;background:var(--field);border:1px solid var(--stroke);border-radius:9px;color:var(--text);
  font-family:var(--f-ui);font-size:13px;padding:9px 11px;transition:.16s;resize:vertical;line-height:1.5}
.frow input::placeholder,.frow textarea::placeholder{color:var(--mute)}
.frow input:focus,.frow textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.frow textarea{min-height:96px}

/* right column */
.rhead{display:flex;align-items:baseline;gap:10px;padding:16px 18px 10px;flex:0 0 auto}
.rhead b{font-weight:600;font-size:13px}
.rhead span{font-family:var(--f-mono);font-size:10.5px;color:var(--mute)}
.paste-wrap{padding:0 18px;flex:1;min-height:0;display:flex}
#paste{width:100%;background:var(--field);border:1px solid var(--stroke);border-radius:11px;color:#cfe0ff;
  font-family:var(--f-mono);font-size:12px;padding:13px;resize:none;line-height:1.6;transition:.16s}
#paste:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ractions{padding:14px 18px 4px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;flex:0 0 auto}
.btn{font-family:var(--f-ui);font-weight:600;font-size:12.5px;padding:9px 15px;border-radius:9px;cursor:pointer;
  border:1px solid var(--stroke);background:rgba(255,255,255,.035);color:var(--text);transition:.16s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--stroke-2);background:rgba(255,255,255,.07)}
.btn svg{width:14px;height:14px;stroke-width:2}
.btn.primary{background:var(--grad);border:none;color:#0a0a12;box-shadow:0 6px 18px rgba(124,92,255,.36)}
.btn.primary:hover{filter:brightness(1.07);box-shadow:0 8px 24px rgba(124,92,255,.5)}
.btn.sm{padding:7px 12px;font-size:12px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:var(--dim);user-select:none}
.check .box{width:18px;height:18px;border-radius:6px;border:1px solid var(--stroke-2);background:var(--field);display:grid;place-items:center;transition:.16s}
.check .box svg{width:12px;height:12px;opacity:0;stroke:#0a0a12;stroke-width:3}
.check.on .box{background:var(--grad);border-color:transparent}
.check.on .box svg{opacity:1}
.check.on{color:var(--text)}

.divider{height:1px;background:var(--stroke);margin:14px 18px}
.rsection{padding:0 18px}
.sublabel{font-family:var(--f-mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin:14px 0 8px;display:flex;align-items:center;justify-content:space-between}
.filebtns{display:flex;gap:9px;flex-wrap:wrap}
.btn.file{flex:1;justify-content:center;min-width:120px}
.massno{display:flex;align-items:center;gap:14px;margin:12px 0 18px}
.massno .m{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.radio{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;color:var(--dim)}
.radio .r{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--stroke-2);display:grid;place-items:center;transition:.16s}
.radio.on .r{border-color:var(--accent)}
.radio.on .r::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--grad)}
.radio.on{color:var(--text)}

/* bottom bar */
#bottom{flex:0 0 auto;border-top:1px solid var(--stroke);background:rgba(12,12,18,.7);backdrop-filter:blur(12px);
  padding:11px 16px;display:flex;align-items:center;gap:10px}
.toolbtns{display:flex;gap:7px;flex-wrap:wrap}
.tool{font-size:12px;font-weight:500;padding:7px 12px;border-radius:8px;border:1px solid var(--stroke);background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer;transition:.16s;white-space:nowrap}
.tool:hover{color:var(--text);border-color:var(--stroke-2);background:rgba(255,255,255,.06)}
.bspace{flex:1}
.fugrid{display:grid;grid-template-columns:auto repeat(3,auto);gap:5px 9px;align-items:center;padding:0 6px}
.fugrid .rowlbl{font-family:var(--f-mono);font-size:10px;color:var(--mute);text-align:right}
.minicheck{width:15px;height:15px;border-radius:4px;border:1px solid var(--stroke-2);background:var(--field);cursor:pointer;display:grid;place-items:center;transition:.14s}
.minicheck.on{background:var(--grad);border-color:transparent}
.minicheck.on::after{content:"";width:7px;height:7px;border-radius:1px;background:#0a0a12}
.fugrid .colhdr{font-family:var(--f-mono);font-size:9.5px;color:var(--mute);text-align:center}
.scripts{display:flex;gap:7px}
.stog{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 9px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;
  border:1px solid var(--stroke);background:rgba(255,255,255,.03);color:var(--dim);transition:.18s}
.stog .led{width:8px;height:8px;border-radius:50%;background:#3a3a4a;transition:.18s}
.stog.on{color:var(--text);border-color:rgba(57,224,162,.3);background:rgba(57,224,162,.08)}
.stog.on .led{background:var(--good);box-shadow:0 0 9px var(--good)}
.credit{font-family:var(--f-mono);font-size:10px;color:var(--mute);margin-left:8px}

/* toast */
#toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(20px);z-index:50;
  background:var(--panel-solid);border:1px solid var(--stroke-2);border-radius:11px;padding:11px 18px;font-size:13px;font-weight:600;
  box-shadow:0 16px 40px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:9px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .d{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="shell">

  <!-- titlebar -->
  <div id="titlebar">
    <div class="brand"><div class="logo">M</div><div><b>MMA</b> <span class="ver">v1.4.1</span></div></div>
    <div class="tb-status"><span class="d"></span><span>ENGINE LIVE</span></div>
    <div class="tb-space"></div>
    <div class="wbtn" data-win="min"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><path d="M2 6h8"/></svg></div>
    <div class="wbtn" data-win="max"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></div>
    <div class="wbtn close" data-win="close"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor"><path d="M3 3l6 6M9 3l-6 6"/></svg></div>
  </div>

  <div id="body">
    <!-- LEFT: mass tabs + fields -->
    <div class="col">
      <div class="tabs" id="tabs">
        <div class="tab on" data-t="1">Mass 1</div>
        <div class="tab" data-t="2">Mass 2</div>
        <div class="tab" data-t="3">Mass 3</div>
      </div>
      <div class="form" id="form"></div>
    </div>

    <!-- RIGHT: paste + actions -->
    <div class="col">
      <div class="rhead"><b>Paste block</b><span>blank = group sep · ppv = ppv section</span></div>
      <div class="paste-wrap"><textarea id="paste" placeholder="Paste a mass here, then Parse — or Export !mma to build it from the fields."></textarea></div>
      <div class="ractions">
        <button class="btn primary" id="btnParse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>Parse</button>
        <button class="btn" id="btnClear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>Clear</button>
        <button class="btn" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12M8 11l4 4 4-4M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>Export !mma</button>
        <div class="check on" id="chkArchive"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12l5 5L20 7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Archive</div>
      </div>

      <div class="divider"></div>

      <div class="rsection">
        <div class="sublabel">Load fields from file <button class="btn sm" id="btnArch">Load from archive</button></div>
        <div class="filebtns"><button class="btn file" id="btnLoad">load Aliw</button></div>

        <div class="sublabel" style="margin-top:16px">Apply to file</div>
        <div class="filebtns"><button class="btn file" id="btnSave">save Aliw</button></div>

        <div class="sublabel" style="margin-top:16px">Set massNo</div>
        <div class="massno">
          <span class="m">M1</span>
          <div class="radio on" data-mn="1"><span class="r"></span>1</div>
          <div class="radio" data-mn="2"><span class="r"></span>2</div>
          <div class="radio" data-mn="3"><span class="r"></span>3</div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div id="bottom">
    <div class="toolbtns">
      <button class="tool">Open with Code</button>
      <button class="tool">Settings</button>
      <button class="tool">Add Hotkey</button>
      <button class="tool">How to Use</button>
      <button class="tool">New Script</button>
    </div>
    <div class="bspace"></div>
    <div class="fugrid" id="fugrid"></div>
    <div class="scripts">
      <div class="stog on" data-s="ALIW"><span class="led"></span>ALIW</div>
      <div class="stog on" data-s="TEMP"><span class="led"></span>TEMP</div>
    </div>
    <div class="credit">made by actually.silly</div>
  </div>
</div>

<div id="toast"><span class="d"></span><span id="toast-msg"></span></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* field schema (faithful to mass_gui) */
const FIELDS=[
  {k:"mass",l:"!mm",key:1},
  {k:"fu1",l:"f1"},{k:"fu15",l:"f1.5"},{k:"fu17",l:"f1.7",gap:1},
  {k:"fu2",l:"f2"},{k:"fu25",l:"f2.5"},{k:"fu27",l:"f2.7",gap:1},
  {k:"fu3",l:"f3"},{k:"fu35",l:"f3.5"},{k:"fu37",l:"f3.7",gap:1},
  {k:"ppv",l:"ppv",ta:1},
  {k:"ppvfu1",l:"ppvfu1"},{k:"ppvfu2",l:"ppvfu2"},{k:"ppvfu3",l:"ppvfu3"},
];
const KEYS=FIELDS.map(f=>f.k);
const state={1:blank(),2:blank(),3:blank()};   // per-mass field values
let tab=1;
function blank(){const o={};KEYS.forEach(k=>o[k]="");return o;}

/* render field form */
$("#form").innerHTML=FIELDS.map(f=>`
  <div class="frow ${f.gap?"gap":""} ${f.key?"key":""}">
    <label>${f.l}:</label>
    ${f.ta?`<textarea data-f="${f.k}"></textarea>`:`<input data-f="${f.k}" type="text">`}
  </div>`).join("");
const fEls={}; $$("[data-f]").forEach(el=>fEls[el.dataset.f]=el);

function formToState(){KEYS.forEach(k=>state[tab][k]=fEls[k].value);}
function stateToForm(){KEYS.forEach(k=>fEls[k].value=state[tab][k]||"");}

/* tabs */
$$(".tab").forEach(t=>t.addEventListener("click",()=>{
  formToState();
  $$(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
  tab=+t.dataset.t; stateToForm();
}));
$$("[data-f]").forEach(el=>el.addEventListener("input",formToState));

/* build positional !mma text (verified format) */
function esc(s){return (s||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n").trim();}
function buildMMA(f){
  const out=[]; const mass=esc(f.mass).replace(/\n+/g," ").trim();
  if(mass)out.push("!mma "+mass);
  for(const g of [["fu1","fu15","fu17"],["fu2","fu25","fu27"],["fu3","fu35","fu37"]]){
    const L=[]; g.forEach(k=>{const v=esc(f[k]);if(v)L.push(v);});
    if(L.length){out.push("");out.push(L.join("\n"));}
  }
  const p=esc(f.ppv);
  if(p){out.push("");out.push("ppv");out.push(p);
    const pf=[]; ["ppvfu1","ppvfu2","ppvfu3"].forEach(k=>{const v=esc(f[k]);if(v)pf.push(v);});
    if(pf.length){out.push("");out.push(pf.join("\n"));}}
  return out.join("\n");
}
/* light positional parse (mass + blank-sep groups; lone "ppv" marker) */
function parseMMA(raw){
  const f=blank();
  const lines=raw.replace(/\r\n/g,"\n").split("\n");
  let mass=lines.find(l=>/^!?mm[a]?[\s:]/i.test(l.trim()));
  if(mass)f.mass=mass.trim().replace(/^!?mm[a]?[\s:]+/i,"");
  const groups=[];let cur=[];
  for(const raw2 of lines){const t=raw2.trim();
    if(/^!?mm[a]?[\s:]/i.test(t))continue;
    if(t==="")  {if(cur.length){groups.push(cur);cur=[];}} else cur.push(t);}
  if(cur.length)groups.push(cur);
  const fu=[["fu1","fu15","fu17"],["fu2","fu25","fu27"],["fu3","fu35","fu37"]];
  let fi=0,skip=-1;
  groups.forEach((g,gi)=>{
    if(gi===skip)return;
    if(/^ppv/i.test(g[0])){
      const first=g[0].replace(/^ppv\s*/i,"");
      f.ppv=[first,...g.slice(1)].filter(Boolean).join("\n").trim();
      const nx=groups[gi+1];
      if(nx){skip=gi+1;["ppvfu1","ppvfu2","ppvfu3"].forEach((s,i)=>{if(nx[i])f[s]=nx[i];});}
      return;
    }
    if(fi>2)return;
    fu[fi].forEach((s,i)=>{if(g[i])f[s]=g[i];}); fi++;
  });
  return f;
}

/* actions */
let tt;
function toast(m){$("#toast-msg").textContent=m;$("#toast").classList.add("show");clearTimeout(tt);tt=setTimeout(()=>$("#toast").classList.remove("show"),2400);}
$("#btnExport").addEventListener("click",()=>{formToState();$("#paste").value=buildMMA(state[tab]);toast("Built !mma into the paste block");});
$("#btnParse").addEventListener("click",()=>{const raw=$("#paste").value.trim();if(!raw)return toast("Paste block is empty");state[tab]=parseMMA(raw);stateToForm();toast("Parsed into Mass "+tab);});
$("#btnClear").addEventListener("click",()=>{$("#paste").value="";state[tab]=blank();stateToForm();toast("Cleared Mass "+tab);});
$("#btnLoad").addEventListener("click",()=>toast("Load Aliw → reads 1_mass.ahk (needs the app backend)"));
$("#btnSave").addEventListener("click",()=>{formToState();toast("Save Aliw → writes 1_mass.ahk (needs the app backend)");});
$("#btnArch").addEventListener("click",()=>toast("Archive browser → coming from the backend"));

/* checkbox / radio / toggle chrome */
$("#chkArchive").addEventListener("click",e=>e.currentTarget.classList.toggle("on"));
$$(".radio").forEach(r=>r.addEventListener("click",()=>{$$(".radio").forEach(x=>x.classList.remove("on"));r.classList.add("on");toast("Active mass → M"+r.dataset.mn);}));
$$(".stog").forEach(s=>s.addEventListener("click",()=>{s.classList.toggle("on");toast(s.dataset.s+(s.classList.contains("on")?" started":" stopped"));}));
$$(".wbtn").forEach(w=>w.addEventListener("click",()=>toast("window "+w.dataset.win+" (wired by the app shell)")));

/* FuSingle grid: Ed row + M1/M2/M3 × F1/F2/F3 */
(function(){
  let h='<div></div>'+["F1","F2","F3"].map(c=>`<div class="colhdr">${c}</div>`).join("");
  const rows=[["Ed","ed"],["M1","1"],["M2","2"],["M3","3"]];
  rows.forEach(([lbl])=>{
    h+=`<div class="rowlbl">${lbl}</div>`+[1,2,3].map(()=>`<div class="minicheck"></div>`).join("");
  });
  $("#fugrid").innerHTML=h;
  $$("#fugrid .minicheck").forEach(m=>m.addEventListener("click",()=>m.classList.toggle("on")));
})();

/* seed Mass 1 with realistic content */
state[1]={mass:"heyy stranger 👀 you around?",fu1:"was literally just thinking about you ngl 🙈",fu15:"",fu17:"",
  fu2:"ok i have to ask… are you good with your hands? 😏",fu25:"",fu27:"",
  fu3:"i might've made something tonight i probably shouldn't have 🙊",fu35:"",fu37:"",
  ppv:"okay don't judge me but i couldn't stop thinking about our last convo so i made you a little something 🔥 wanna see?",
  ppvfu1:"no pressure at all, just tell me what you think 🫶",ppvfu2:"",ppvfu3:""};
stateToForm();
</script>
</body>
</html>
