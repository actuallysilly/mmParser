; =============================================================================
;  MMA hotkeys - THE single source of truth. Every hotkey in MMA lives here.
;
;  Edit this file directly, or use the Hotkeys GUI (mass_gui -> "Hotkeys...").
;  Changes apply live - no restart.
;
;  Modifiers:   ^ = Ctrl    ! = Alt    + = Shift    # = Win
;  Examples:    F4   !F4 (Alt+F4)   ^+z (Ctrl+Shift+Z)   XButton2   ^MButton
;  Blank value = that feature is disabled.
;  F13-F24     = Corsair Scimitar side buttons 1-12.
;
;  NOTE: comments must sit on their own line. Windows' ini reader does NOT
;  strip a trailing "; comment" from a value - it would become part of the key.
; =============================================================================


; --- Navigation --------------------------------------------------------------
[nav]
unread          =!-
focusAuto       =!Space
nextChat        =
unreadLeft      =+Left
focusTop        =Up
clickUnread     =Del
clickHome       =End
clickPpv        =PgDn


; --- Mass: model 1 -----------------------------------------------------------
; fu1-fu3 are shared with models 2 and 3 and are auto-gated to whichever model
; tab is active, so the same key can serve every model. Every send key below is
; gated the same way (F-keys, alt keys, mouse and Scimitar alike).
[mass.1]
fu1             =F1
fu2             =F2
fu3             =F3
altFu1         = ^F1
altFu2         = ^F2
altFu3         = ^F3
fu1short        =
fu2short        =
fu3short        =
mFu1            = XButton2
mFu2            = XButton1
mFu3            = ^MButton
smFu1           = F13
smFu2           = F14
smFu3           = F15
ppv             =F4
ppvFus          =F5
b1Ppv           = !F4
b2Fu2           = F6
b2Fu3           = F7
b2Ppv           = F8
b2PpvFus        = !F8


; --- Mass: model 2 -----------------------------------------------------------
[mass.2]
fu1             =F9
fu2             =F10
fu3             =F11
altFu1         = ^F9
altFu2         = ^F10
altFu3         = ^F11
smFu1           = F13
smFu2           = F14
smFu3           = F15
ppv             =F12
ppvFus          =!F12


; --- Mass: model 3 -----------------------------------------------------------
[mass.3]
fu1             =F6
fu2             =F7
fu3             =!F7
altFu1         = ^F6
altFu2         = ^F7
altFu3         = ^!F7
smFu1           = F13
smFu2           = F14
smFu3           = F15
ppv             =F8
ppvFus          =!F8


; --- Chat --------------------------------------------------------------------
; Chrome only.
[chat]
captureEnter    = Enter


; --- Sequences ---------------------------------------------------------------
; copyDiscordMsg fires in Discord only.
[seq]
openFarmolijer  = ^!f
copyDiscordMsg  = ^LButton
selectTopPpv    =


; --- Utilities ---------------------------------------------------------------
[util]
afkClick        = ^p
recoverMsg      = ^+z
clickSecondGrey = F24
debugGrey       = F23


; --- GUI ---------------------------------------------------------------------
; toggleDoubleMM fires only while Mouse control is on in Settings.
; ocrGrab: drag a box on screen, OCR it, and open Add Hotkey prefilled.
[gui]
addHotkeyGrab   = !0
ocrGrab         = !+0
toggleDoubleMM  = MButton


; --- Recorder ----------------------------------------------------------------
[recorder]
toggle          =^!F12


; --- Automation --------------------------------------------------------------
; Bound by Python, NOT AHK. Declared in hotkeys.ahk so this GUI can edit them, but
; nothing AHK-side binds them: they only fire while the listener is running.
; Start it silently (no console, like the AHK scripts) by double-clicking
;     infloww ui elements\automation_listen.vbs
; Stop / check:  python "infloww ui elements\automation.py" --stop  (or --status)
; It logs to error_log.txt, re-reads this file live, and gates itself to the
; Infloww Messages window. Blank = disabled, same as everywhere else.
; unsendLast: unsends your bottom-most message. If your last run (everything sent
; since the fan's last reply) has more than one, a prompt appears - press the key
; again to unsend the whole run, tap Esc for just the last, HOLD Esc to cancel.
[automation]
hopKebabs       = ^!k
unsendLast      = ^!u
countSales      = ^!s


; --- General -----------------------------------------------------------------
[general]
openFast        = !+=
openAndRate     = !+]


; --- Account: ALIW -----------------------------------------------------------
[aliw]
intro           = !I
loved           = !e
glimpse         = !F1
whatLoved       = !L
ascend          = !F2
openThat        = !9
infiniteLust    = !8


; --- Account: TEMP -----------------------------------------------------------
[temp]
fantasy         = !.


; --- Britishizer -------------------------------------------------------------
; Grabs Enter globally. Blank these out if you run capitalizer.ahk instead -
; both scripts bind bare Enter and will fight each other if run together.
[brit]
enterPass       = !Enter
fixSend         = Enter
fixNoSend       = #Enter


; --- Capitalizer -------------------------------------------------------------
; See the note under [brit] - these two scripts both claim bare Enter.
[cap]
enterCap        = Enter
enterPass1      = +Enter
enterPass2      = ^Enter
[meta]
SchemaVersion=2
DoubleFireWindowMs=200
